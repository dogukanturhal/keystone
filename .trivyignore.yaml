# Trivy exception list — keystone
#
# Every entry here is a CVE in a THIRD-PARTY BINARY we download, not in
# code this repo builds. kubectl and cosign are shipped as prebuilt Go
# binaries in keystone-tools; their dependencies are vendored at upstream
# build time, so a fix requires upstream to cut a release rebuilt against
# the patched library. Bumping our own go.mod cannot move them, and
# neither can `--ignore-unfixed`: Trivy considers these "fixed" because a
# fixed version of the *library* exists, even though no rebuilt *binary*
# does.
#
# Why an exception list rather than allow_failure:
#   vuln-scan-tools-image was allow_failure:true and had been failing
#   since 2026-06-14 — seven weeks of a red gate nobody could see, which
#   is indistinguishable from having no gate. Listing the known-unfixable
#   findings makes the job green, so the NEXT new CVE turns it red and
#   means something.
#
# Every entry carries expired_at. On that date Trivy stops honouring the
# entry and the job goes red again, forcing a re-check of whether
# upstream has shipped a rebuild. Exceptions that never expire become
# permanent blindness.
#
# Review procedure when one expires:
#   1. Check the newest kubectl / cosign release.
#   2. `go version -m <binary> | grep <dep>` to read what it actually
#      vendored — release notes are not evidence.
#   3. If fixed, bump the ARG in Dockerfile.tools and delete the entry.
#   4. If not, extend expired_at with the date checked.

vulnerabilities:
  # --- kubectl v1.37.1 (newest release; vendors x/text v0.40.0, built on go1.26.8)
  - id: CVE-2026-56851
    paths:
      - usr/local/bin/kubectl
    statement: >-
      golang.org/x/text v0.40.0 vendored in the upstream kubectl v1.37.1
      binary; fixed in v0.41.0. v1.37.1 is the newest kubectl release
      (2026-10-29), so bumping our ARG cannot move it. Clears when upstream
      ships a release built against x/text >= 0.41.0.
    expired_at: 2026-11-30
  - id: CVE-2026-111943
    paths:
      - usr/local/bin/kubectl
    statement: >-
      Go stdlib in the upstream kubectl v1.37.1 binary (go1.26.8); fixed in
      go1.26.10 / 1.27.3. Newest release as of 2026-10-29. keystonectl is
      built by us and moves to go1.26.10 in Dockerfile.tools, so only the
      kubectl path is excepted.
    expired_at: 2026-11-30
  - id: CVE-2026-78667
    paths:
      - usr/local/bin/kubectl
      - usr/local/bin/cosign
    statement: >-
      Go stdlib in upstream binaries (cosign v3.1.3 on go1.26.4, kubectl
      v1.37.1 on go1.26.8); fix lands in go1.26.9 / 1.27.2. Checked
      2026-10-15: no rebuilt release exists. Clears when upstream ships on
      go1.26.9+.
    expired_at: 2026-11-20
  - id: CVE-2026-78669
    paths:
      - usr/local/bin/kubectl
      - usr/local/bin/cosign
    statement: >-
      Go stdlib (go1.26.4 / go1.26.8) and golang.org/x/net (cosign v0.56.0,
      kubectl v0.57.0; fixed in 0.60.0) vendored by the upstream binaries.
      Checked 2026-10-15: newest cosign v3.1.3 and kubectl v1.37.1 are not
      rebuilt. Clears when upstream ships on go1.26.9+ / x/net 0.60.0+.
    expired_at: 2026-11-20
  - id: CVE-2026-97031
    paths:
      - usr/local/bin/kubectl
      - usr/local/bin/cosign
    statement: >-
      Same go1.26.4 / go1.26.8 stdlib as CVE-2026-78667 above; fix in
      go1.26.9 / 1.27.2. Checked 2026-10-15: no rebuilt release exists.
    expired_at: 2026-11-20
