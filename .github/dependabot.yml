version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
    open-pull-requests-limit: 10

  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
