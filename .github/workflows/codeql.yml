name: CodeQL

on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", ".github/workflows/codeql.yml"]
  pull_request:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", ".github/workflows/codeql.yml"]
  schedule:
    - cron: "15 5 * * 1"

permissions: read-all

jobs:
  analyze:
    name: Go analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: go
          queries: security-extended

      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: codeql-go
