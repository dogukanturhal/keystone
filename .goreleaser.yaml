version: 2

project_name: keystone

before:
  hooks:
    - go mod download

builds:
  - id: manager
    main: ./cmd/manager
    binary: keystone-manager
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
  - id: keystonectl
    main: ./cmd/keystonectl
    binary: keystonectl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
  - id: keystoneadm
    main: ./cmd/keystoneadm
    binary: keystoneadm
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    # keystone-manager is linux-only while the CLIs also ship for darwin.
    allow_different_binary_count: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - LICENSE-Apache-SDK
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

# SPDX SBOM per archive (needs syft on PATH; the release workflow installs it).
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

# Keyless cosign signature over the checksum file; verify with the commands in
# docs/verify-releases.md.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
