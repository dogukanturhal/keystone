# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Phase 1 — keystone-manager Deployment with replicas=0. The image is
# built and pushed by CI but no pods run until Phase 2 lands a real
# controller. This keeps the deployment surface in Git from day 1 so
# Argo CD can detect any manual scale-up immediately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystone-manager
  namespace: keystone-system
  labels:
    app.kubernetes.io/name: keystone-manager
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: keystone
spec:
  # Phase 12 — HA default: 2 replicas with leader election. Only the
  # leader reconciles; the spare takes over within the lease TTL on
  # pod failure. See docs/operator-hardening.md §9.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: keystone-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keystone-manager
        app.kubernetes.io/component: operator
        app.kubernetes.io/part-of: keystone
    spec:
      serviceAccountName: keystone-manager
      automountServiceAccountToken: true
      # Soft anti-affinity — prefer to schedule the two replicas on
      # different nodes so a single node failure doesn't take both
      # out. Soft rather than required so small clusters still get
      # scheduled.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: keystone-manager
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: keystone-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/dogukanturhal/keystone-manager:v0.1.1
          imagePullPolicy: IfNotPresent
          args:
            - --start-manager
            - --leader-elect
            - --secure-metrics
            - --metrics-bind-address=:8443
            - --health-probe-bind-address=:8081
            - --role=hub
            - --system-namespace=$(POD_NAMESPACE)
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: webhook-certs
          secret:
            secretName: keystone-webhook-server-cert
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keystone-manager
  namespace: keystone-system
  labels:
    app.kubernetes.io/name: keystone-manager
    app.kubernetes.io/part-of: keystone
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keystone-manager
  namespace: keystone-system
  labels:
    app.kubernetes.io/name: keystone-manager
    app.kubernetes.io/part-of: keystone
spec:
  # Keep at least one manager up during voluntary disruptions (node
  # drains, cluster upgrades). Paired with replicas=2 this means one
  # replica may be drained at a time.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keystone-manager
---
apiVersion: v1
kind: Service
metadata:
  name: keystone-manager-metrics
  namespace: keystone-system
  labels:
    app.kubernetes.io/name: keystone-manager
    app.kubernetes.io/part-of: keystone
spec:
  selector:
    app.kubernetes.io/name: keystone-manager
  ports:
    - name: https-metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
