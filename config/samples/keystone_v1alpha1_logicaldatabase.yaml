#
# Sample LogicalDatabase — the existing example_suite shared database that
# currently houses the 19 ExampleSuite module schemas. Phase 2's SchemaController
# will be responsible for ensuring this database exists with the requested
# extensions and owner role.
apiVersion: keystone.hexxlock.io/v1alpha1
kind: LogicalDatabase
metadata:
  name: examplesuite
  namespace: keystone-system
spec:
  name: example_suite
  clusterRef: prod-eu-west-1-hub
  providerRef: example-pg
  ownerRole: example_suite_owner
  deletionPolicy: Retain  # safety default — never drop the DB on CR delete
  extensions:
    - uuid-ossp
    - pgcrypto
    - pg_stat_statements
  encoding: UTF8
  collation: C
  ctype: C
  connectionLimit: -1
