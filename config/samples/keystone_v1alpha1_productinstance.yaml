#
# Sample ProductInstance — the exampletenant test tenant subscribing
# to ExampleSuite (an internal end-to-end gateway test account).
apiVersion: keystone.hexxlock.io/v1alpha1
kind: ProductInstance
metadata:
  name: exampletenant-example
  namespace: keystone-system
spec:
  tenantID: 00000000-0000-0000-0000-000000000001
  tenantSlug: exampletenant
  productRef: example
  region: eu-west-1
  deletionPolicy: Retain  # safety default — never auto-drop the test tenant's data
