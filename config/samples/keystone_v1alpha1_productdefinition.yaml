#
# Sample ProductDefinition — ExampleSuite, the flagship business product.
# Replaces the legacy iam_products row with a Git-tracked CR.
apiVersion: keystone.hexxlock.io/v1alpha1
kind: ProductDefinition
metadata:
  name: example
spec:
  slug: example
  displayName: "ExampleSuite"
  defaultIsolation: bridge
  databases:
    - key: core
      nameTemplate: "example_{{tenantID}}"
      providerRef: example-pg
      extensions:
        - uuid-ossp
        - pgcrypto
        - pg_stat_statements
      schemas:
        - key: crm
          nameTemplate: crm
        - key: marketing
          nameTemplate: marketing
        - key: invoicing
          nameTemplate: invoicing
        - key: master_data
          nameTemplate: master_data
    - key: financials
      nameTemplate: "example_financials_{{tenantID}}"
      providerRef: example-pg
      isolation: silo  # PCI surface — full DB isolation per tenant
      extensions:
        - uuid-ossp
        - pgcrypto
      schemas:
        - key: payments
          nameTemplate: payments
        - key: billing
          nameTemplate: billing
  apiRoutes:
    - path: /api/v1/example/crm
      upstreamService: example-crm
      upstreamPort: 8080
    - path: /api/v1/example/billing
      upstreamService: example-billing
      upstreamPort: 8080
  lifecycleHooks:
    - on: Activated
      url: https://falcon-id.keystone-system.svc.cluster.local/api/v1/lifecycle/activated
      signingSecretRef: falcon-id-lifecycle-hmac
