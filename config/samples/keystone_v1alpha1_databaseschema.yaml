#
# Sample DatabaseSchema — the CRM module's schema inside example_suite.
# Mirrors db-migrator's hardcoded {SharedDB:example_suite, Schema:crm} pair
# (cmd/main.go:238). Phase 2's SchemaController will create the schema and
# grant ownership; Phase 3's MigrationController will run the SQL.
apiVersion: keystone.hexxlock.io/v1alpha1
kind: DatabaseSchema
metadata:
  name: crm
  namespace: keystone-system
spec:
  name: crm
  logicalDatabaseRef: examplesuite
  ownerRole: crm_owner
  defaultPrivileges:
    - role: crm_app
      objectType: tables
      privileges: [SELECT, INSERT, UPDATE, DELETE]
    - role: crm_app
      objectType: sequences
      privileges: [USAGE, SELECT, UPDATE]
    - role: crm_readonly
      objectType: tables
      privileges: [SELECT]
  searchPathHints:
    - master_data
