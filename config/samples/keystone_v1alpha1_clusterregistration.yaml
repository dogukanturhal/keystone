#
# Sample ClusterRegistration — the hub itself running as the only canary
# cluster. Phase 7 will register a second cluster as `tier: free` once
# multi-cluster rollout is wired.
apiVersion: keystone.hexxlock.io/v1alpha1
kind: ClusterRegistration
metadata:
  name: prod-eu-west-1-hub
  labels:
    keystone.hexxlock.io/role: hub-and-only
spec:
  displayName: "Production EU-West-1 (hub + sole canary)"
  tier: canary
  region: eu-west-1
  dataResidency: eu
  labels:
    extensions-allowlist: "uuid-ossp,pgcrypto,pg_stat_statements,citus,vector"
    cni: cilium
    storage: rook-ceph
