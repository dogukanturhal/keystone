#
# MigrationPlan — Plan-Gate-Apply review artifact.
#
# Plans are generated by the MigrationBundleReconciler when it fans
# out to each matched DatabaseSchema. Authors do NOT hand-write plans;
# this sample exists so you know what `kubectl get migrationplan -o yaml`
# looks like and how to flip the approval gate.
#
# Workflow:
#   1. Apply a MigrationBundle — the controller creates one MigrationPlan
#      per matched schema.
#   2. Review `spec.statements` to see what SQL will run.
#   3. If `status.approvalMode=Auto` the plan self-approves; if Manual,
#      flip `spec.approved=true` when ready:
#        keystonectl plan approve <ns>/<plan-name>
#      or via kubectl:
#        kubectl patch migrationplan <name> -n <ns> \
#          --type=merge -p '{"spec":{"approved":true}}'
#   4. The MigrationExecution referencing this plan picks up the flip
#      within ~1s (watch wired in the execution reconciler) and applies.
#
# See docs/adrs/0017-plan-gate-apply.md for the design rationale.
apiVersion: keystone.hexxlock.io/v1alpha1
kind: MigrationPlan
metadata:
  name: users-service-v1-users-plan
  namespace: keystone-system
  labels:
    keystone.hexxlock.io/bundle: users-service-v1
    keystone.hexxlock.io/version: v1.0.0
    keystone.hexxlock.io/schema: users
spec:
  bundleRef: users-service-v1
  bundleVersion: v1.0.0
  schemaRef: users
  # The gate. False (default) means executions pause until flipped;
  # Auto-mode policies flip it automatically, Manual-mode policies
  # leave it for a reviewer.
  approved: false
  # Planned DDL. Populated by the controller — authors do NOT write
  # this by hand. Each entry is truncated to 4 KiB; full SQL lives
  # in the bundle's source ConfigMap.
  statements:
    - file: 001_create_users.up.sql
      index: 1
      sql: |
        CREATE TABLE IF NOT EXISTS users (
          id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
          email text NOT NULL UNIQUE,
          created_at timestamptz NOT NULL DEFAULT now()
        );
    - file: 002_index_email.up.sql
      index: 2
      sql: |
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_email
          ON users (email);
