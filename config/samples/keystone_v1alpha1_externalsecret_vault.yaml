#
# Vault → Secret → DatabaseProvider wiring via External Secrets
# Operator (ESO). Demonstrates the C5 rotation flow:
#
#   1. ESO's ExternalSecret syncs from Vault (kv/keystone/admin) on
#      the declared refreshInterval.
#   2. ESO creates/updates the target Secret with the new password
#      each refresh cycle.
#   3. Keystone's DatabaseProviderReconciler watches the Secret;
#      on RV change it evicts cached pools bound to this provider
#      and stamps status.credentialsRotatedAt.
#
# Requires ESO installed in the cluster (v0.9+) and a
# ClusterSecretStore named `vault-keystone` (or equivalent)
# authenticated to HashiCorp Vault. See
# docs/adrs/0024-credential-rotation-eso.md for the design.
---
# ESO syncs Vault kv/keystone/admin into a native Kubernetes Secret
# every 15 minutes. refreshInterval = how often Vault is polled;
# actual Keystone rotation observation is near-instant via the
# Secret watch in DatabaseProviderReconciler.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keystone-admin-creds
  namespace: keystone-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-keystone
  target:
    name: example-pg-admin          # the Secret DatabaseProvider points at
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: kv/keystone/admin
        property: username
    - secretKey: password
      remoteRef:
        key: kv/keystone/admin
        property: password
---
# The DatabaseProvider stays unchanged — it references the Secret
# name, not Vault. The operator is ESO-agnostic.
apiVersion: keystone.hexxlock.io/v1alpha1
kind: DatabaseProvider
metadata:
  name: example-pg
spec:
  engine: postgresql
  host: example-pg-rw.cnpg-system.svc.cluster.local
  port: 5432
  maintenanceDatabase: postgres
  sslMode: require
  adminCredentialsRef:
    secretName: example-pg-admin
    usernameKey: username
    passwordKey: password
  poolMaxConns: 4
