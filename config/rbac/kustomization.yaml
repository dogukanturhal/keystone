apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - role.yaml                            # generated by controller-gen (do not hand-edit)
  - role_binding.yaml                    # hand-maintained ClusterRoleBindings
  - tenant_enroller_clusterrole.yaml     # SDK-caller ClusterRole — bind via RoleBinding per product ns
