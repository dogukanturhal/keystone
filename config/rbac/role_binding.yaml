#
# RBAC bindings for the keystone-manager ServiceAccount. The ClusterRole
# itself (role.yaml) is generated by controller-gen from kubebuilder rbac
# markers — bindings stay in this file because they reference the SA
# namespace which the generator does not know about.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keystone-manager
  labels:
    app.kubernetes.io/name: keystone-manager
    app.kubernetes.io/part-of: keystone
subjects:
  - kind: ServiceAccount
    name: keystone-manager
    namespace: keystone-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: keystone-manager-role  # name comes from controller-gen Makefile arg
---
# Authorization delegation for the secure metrics endpoint (replaces
# kube-rbac-proxy). The manager performs SubjectAccessReview against the
# kube API for every metrics request.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keystone-manager-auth-delegator
  labels:
    app.kubernetes.io/name: keystone-manager
    app.kubernetes.io/part-of: keystone
subjects:
  - kind: ServiceAccount
    name: keystone-manager
    namespace: keystone-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
