{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "keystone-operator.fullname" . }}-manager
  labels:
    {{- include "keystone-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "keystone-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "keystone-operator.fullname" . }}-manager-role
---
# Authorization delegation for the secure metrics endpoint (SAR authz
# replaces kube-rbac-proxy — see ADR 0004).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "keystone-operator.fullname" . }}-auth-delegator
  labels:
    {{- include "keystone-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "keystone-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
{{- end }}
