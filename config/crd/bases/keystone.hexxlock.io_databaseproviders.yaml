---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: databaseproviders.keystone.hexxlock.io
spec:
  group: keystone.hexxlock.io
  names:
    kind: DatabaseProvider
    listKind: DatabaseProviderList
    plural: databaseproviders
    shortNames:
    - dbp
    - provider
    singular: databaseprovider
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.engine
      name: Engine
      type: string
    - jsonPath: .spec.host
      name: Host
      type: string
    - jsonPath: .spec.port
      name: Port
      type: integer
    - jsonPath: .spec.sslMode
      name: SSL
      type: string
    - jsonPath: .status.serverVersion
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DatabaseProvider declares a physical database cluster the operator may
          administer. LogicalDatabase resources reference a DatabaseProvider via
          spec.providerRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DatabaseProviderSpec describes a physical PostgreSQL cluster reachable
              from the operator. Cluster-scoped because providers are platform
              infrastructure shared across tenants and namespaces.
            properties:
              adminCredentialsRef:
                description: AdminCredentialsRef references the Secret holding admin
                  user/password.
                properties:
                  passwordKey:
                    default: password
                    description: PasswordKey is the Secret data key for the admin
                      password.
                    maxLength: 253
                    type: string
                  secretName:
                    description: |-
                      SecretName is the name of the Secret in the keystone-system
                      namespace. Required.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  usernameKey:
                    default: username
                    description: UsernameKey is the Secret data key for the admin
                      username.
                    maxLength: 253
                    type: string
                required:
                - secretName
                type: object
              engine:
                description: Engine declares the database engine. PostgreSQL only
                  in Phase 2.
                enum:
                - postgresql
                type: string
              host:
                description: |-
                  Host is the DNS name or IP of the primary writer endpoint. The
                  controller routes administrative DDL to this endpoint; read replicas
                  are out of scope for SchemaController.
                maxLength: 253
                type: string
              maintenanceDatabase:
                default: postgres
                description: |-
                  MaintenanceDatabase is the database the controller connects to for
                  administrative work that cannot run inside a target database
                  (e.g. CREATE DATABASE). Defaults to "postgres".
                maxLength: 63
                pattern: ^[a-z_][a-z0-9_]*$
                type: string
              poolMaxConns:
                default: 4
                description: |-
                  PoolMaxConns caps the controller's pgx pool size against this
                  provider. Higher values speed up large-fanout reconciles but consume
                  more PG backends; tune per workload.
                format: int32
                maximum: 64
                minimum: 1
                type: integer
              port:
                default: 5432
                description: Port is the TCP port the engine listens on.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              sslMode:
                default: verify-full
                description: |-
                  SSLMode controls TLS verification. `disable` is intentionally
                  unavailable; downgrade requires an out-of-band policy override.
                enum:
                - require
                - verify-ca
                - verify-full
                type: string
            required:
            - adminCredentialsRef
            - engine
            - host
            type: object
          status:
            description: DatabaseProviderStatus reports observed connectivity.
            properties:
              conditions:
                description: |-
                  Conditions reports the current state. Standard set: Ready,
                  Available, Progressing, Degraded. Specific to providers: Connected
                  (controller has an open admin session and SELECT 1 succeeded within
                  the last reconcile interval).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsObservedVersion:
                description: |-
                  CredentialsObservedVersion is the ResourceVersion of the admin
                  Secret at the last DatabaseProviderReconciler observation. Used
                  to detect rotation: when the live Secret's ResourceVersion
                  differs, the reconciler triggers pool eviction so stale
                  credentials don't outlive the ESO sync.
                maxLength: 64
                type: string
              credentialsRotatedAt:
                description: |-
                  CredentialsRotatedAt is the timestamp the reconciler last
                  observed a change in the admin Secret's ResourceVersion. Empty
                  until the first rotation after the provider is admitted.
                  Useful for correlating rotation events with SIEM entries.
                format: date-time
                type: string
              lastConnectTime:
                description: |-
                  LastConnectTime is when the controller last successfully opened an
                  admin connection.
                format: date-time
                type: string
              observedConnectionProfile:
                description: |-
                  ObservedConnectionProfile is the "host:port" endpoint the
                  reconciler most recently observed on spec. When the spec is
                  repointed (server migration, DNS→IP cutover, local
                  port-forward verification) the reconciler compares the live
                  spec against this value, evicts cached pools still dialing the
                  previous endpoint, and updates the field. Mirrors
                  CredentialsObservedVersion, but for the CR-visible half of the
                  connection profile instead of the Secret.
                maxLength: 320
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              serverVersion:
                description: |-
                  ServerVersion is the PostgreSQL server_version reported by the
                  provider. Surfaced for ops visibility and for migration policy
                  rules that want to refuse running on outdated versions.
                maxLength: 64
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
