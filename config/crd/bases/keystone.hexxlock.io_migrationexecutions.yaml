---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: migrationexecutions.keystone.hexxlock.io
spec:
  group: keystone.hexxlock.io
  names:
    kind: MigrationExecution
    listKind: MigrationExecutionList
    plural: migrationexecutions
    shortNames:
    - me
    - exec
    singular: migrationexecution
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bundleRef
      name: Bundle
      type: string
    - jsonPath: .spec.bundleVersion
      name: Version
      type: string
    - jsonPath: .spec.schemaRef
      name: Schema
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.startTime
      name: Started
      type: date
    - jsonPath: .status.completionTime
      name: Done
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MigrationExecution is the per-target run. Created by the
          MigrationController from a MigrationPlan that passed admission.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MigrationExecutionSpec is the immutable definition of one run.
              Generated by the MigrationController; users do NOT author executions
              directly.
            properties:
              bundleRef:
                description: |-
                  BundleRef + BundleVersion duplicate spec from the plan for
                  audit clarity (Plans get garbage-collected; Executions are kept
                  for the audit retention window).
                maxLength: 253
                type: string
              bundleVersion:
                description: |-
                  MaxLength 253 mirrors MigrationBundle.spec.version + MigrationPlan
                  .spec.bundleVersion (kept symmetric to accommodate the content-
                  addressed naming `<sd.Name>-declarative-<contentHash>` introduced
                  in 372de32). 64 char limit on this field would silently reject
                  Executions for Plans/Bundles that the upstream CRDs accept.
                maxLength: 253
                type: string
              contentHash:
                description: |-
                  ContentHash is the SHA-256 of the SQL content the plan was
                  generated from. The runner re-resolves the source and refuses
                  to apply if the hash drifted (paranoia gate against
                  time-of-check / time-of-use bugs).
                maxLength: 64
                type: string
              executionMode:
                default: Apply
                description: |-
                  ExecutionMode is frozen from the bundle at fan-out time, like
                  ContentHash, so a later bundle mutation cannot change what an
                  in-flight execution does. RecordOnly executions upsert the
                  tracking-table row without running any SQL (adoption baseline,
                  ADR 0027). Empty is equivalent to Apply (pre-ADR-0027 objects).
                enum:
                - Apply
                - RecordOnly
                type: string
              planRef:
                description: PlanRef is the MigrationPlan this execution is realising.
                maxLength: 253
                type: string
              schemaRef:
                description: SchemaRef is the DatabaseSchema being mutated.
                maxLength: 253
                type: string
            required:
            - bundleRef
            - bundleVersion
            - contentHash
            - planRef
            - schemaRef
            type: object
          status:
            description: MigrationExecutionStatus reports the run.
            properties:
              applied:
                description: Applied lists what ran. Empty for failed-before-first-statement.
                items:
                  description: AppliedStatement records what actually ran on the target
                    schema.
                  properties:
                    durationMS:
                      description: DurationMS is the wall-clock duration in milliseconds.
                      format: int64
                      minimum: 0
                      type: integer
                    file:
                      description: File the statement was sourced from.
                      type: string
                    index:
                      description: Index within File.
                      format: int32
                      type: integer
                    rowsAffected:
                      description: |-
                        RowsAffected is the PostgreSQL command tag's RowsAffected. -1 for
                        statements that don't return one (most DDL).
                      format: int64
                      minimum: -1
                      type: integer
                  required:
                  - durationMS
                  - file
                  - index
                  - rowsAffected
                  type: object
                maxItems: 2048
                type: array
              completionTime:
                description: CompletionTime is when the runner exited (success or
                  failure).
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions:
                    Started   — controller picked it up and acquired the schema lock.
                    Applied   — every statement ran successfully and was committed.
                    Succeeded — Applied + version recorded in schema_migrations table.
                    Failed    — at least one statement errored; transaction rolled back.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failedAtFile:
                description: FailedAtFile + FailedAtIndex pinpoint the first failing
                  statement.
                type: string
              failedAtIndex:
                format: int32
                minimum: 0
                type: integer
              failureMessage:
                description: |-
                  FailureMessage is the PostgreSQL error verbatim. Truncated to
                  4 KiB to keep the CR manageable.
                maxLength: 4096
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse lifecycle.
                enum:
                - Pending
                - Running
                - Expanding
                - Expanded
                - Contracting
                - Aborting
                - RollingBack
                - Succeeded
                - Failed
                - Aborted
                - RolledBack
                - RollbackFailed
                type: string
              reversalStatements:
                description: |-
                  ReversalStatements is the list of SQL statements that would undo
                  the forward migration. Populated by the declarative differ
                  (Plan.ReverseStatements) or from a resolved down source. Index-
                  aligned with the forward statements when generated by the differ.
                  Empty string entries indicate non-reversible operations (data
                  loss from DROP COLUMN, etc.). Used for emergency manual rollback
                  or by the auto-rollback controller.
                items:
                  type: string
                maxItems: 2048
                type: array
              startTime:
                description: StartTime is when the runner began the apply transaction.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
