---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: driftreports.keystone.hexxlock.io
spec:
  group: keystone.hexxlock.io
  names:
    kind: DriftReport
    listKind: DriftReportList
    plural: driftreports
    shortNames:
    - dr
    - drift
    singular: driftreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.databaseSchemaRef
      name: Schema
      type: string
    - jsonPath: .spec.logicalDatabaseRef
      name: Database
      type: string
    - jsonPath: .status.severity
      name: Severity
      type: string
    - jsonPath: .status.detectedAt
      name: Detected
      type: date
    - jsonPath: .status.lastObservedAt
      name: LastSeen
      type: date
    - jsonPath: .status.findings[*]
      name: Findings
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DriftReport records a divergence between a DatabaseSchema's recorded
          baseline and the live PostgreSQL state. Created by the DriftController;
          users acknowledge or resolve by deleting / labelling.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DriftReportSpec is generated by the DriftController; users do NOT
              author DriftReports directly.
            properties:
              databaseSchemaRef:
                description: |-
                  DatabaseSchemaRef is the namespaced name of the DatabaseSchema
                  the report is about. Same namespace as the report.
                maxLength: 253
                type: string
              logicalDatabaseRef:
                description: |-
                  LogicalDatabaseRef is duplicated from the schema so a single
                  `kubectl get driftreports -o wide` is useful without joining
                  across CR types.
                maxLength: 253
                type: string
              providerRef:
                description: |-
                  ProviderRef is duplicated from the LogicalDatabase for the same
                  reason.
                maxLength: 253
                type: string
            required:
            - databaseSchemaRef
            - logicalDatabaseRef
            - providerRef
            type: object
          status:
            description: DriftReportStatus reports the live observation.
            properties:
              conditions:
                description: |-
                  Conditions:
                    Detected   — controller observed a hash mismatch
                    Acknowledged — operator marked the drift as accepted (Phase 5.1)
                    Resolved   — drift was reconciled (live matches baseline again)
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              detectedAt:
                description: DetectedAt is when the controller first observed the
                  drift.
                format: date-time
                type: string
              expectedHash:
                description: |-
                  ExpectedHash is the baseline hash recorded after the last
                  successful migration (or operator acceptance).
                maxLength: 64
                type: string
              findings:
                description: |-
                  Findings holds per-object deltas. Empty in Phase 5 (hash-only
                  detection); populated in Phase 5.1 when the inspector grows a
                  structural diff implementation.
                items:
                  description: |-
                    DriftFinding describes one delta between the recorded baseline and the
                    observed live schema. The DriftController fills the slice when it
                    detects drift; an empty slice means "drift detected by hash but
                    no per-object diff was computed yet" (Phase 5.1 will populate it).
                  properties:
                    description:
                      description: Description is human-readable detail.
                      maxLength: 2048
                      type: string
                    kind:
                      description: |-
                        Kind classifies the finding.

                        The RLS* and Policy* kinds describe a change in ENFORCEMENT rather
                        than in shape. They are graded Critical when enforcement is lost
                        (see drift.Severity) because, unlike a dropped column, nothing about
                        the schema's shape looks wrong afterwards.

                        This enum gates what the controller may write: an unlisted kind fails
                        apiserver validation and takes the entire DriftReport patch with it,
                        so it must stay in step with the kinds drift.Diff emits.
                      enum:
                      - TableAdded
                      - TableDropped
                      - ColumnAdded
                      - ColumnDropped
                      - ColumnChanged
                      - IndexAdded
                      - IndexDropped
                      - ConstraintAdded
                      - ConstraintDropped
                      - RLSEnabled
                      - RLSDisabled
                      - RLSForced
                      - RLSUnforced
                      - PolicyAdded
                      - PolicyDropped
                      - PolicyChanged
                      - Other
                      type: string
                    object:
                      description: Object is the qualified PG object name (e.g. "crm.leads.score").
                      maxLength: 512
                      type: string
                  required:
                  - kind
                  - object
                  type: object
                maxItems: 128
                type: array
              lastObservedAt:
                description: |-
                  LastObservedAt is the most recent inspection that confirmed the
                  drift still exists.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              observedHash:
                description: ObservedHash is the hash of the live schema at LastObservedAt.
                maxLength: 64
                type: string
              severity:
                description: Severity grades the finding for routing.
                enum:
                - info
                - warning
                - critical
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
