---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: productinstances.keystone.hexxlock.io
spec:
  group: keystone.hexxlock.io
  names:
    kind: ProductInstance
    listKind: ProductInstanceList
    plural: productinstances
    shortNames:
    - pi
    - instance
    singular: productinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantID
      name: Tenant
      type: string
    - jsonPath: .spec.productRef
      name: Product
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ProductInstance represents one tenant's subscription to a product.
          Replaces the iam_product_instances row in the legacy db-provisioner.
          The TenancyController reconciles it through the lifecycle phases by
          creating child LogicalDatabase + DatabaseSchema CRs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProductInstanceSpec describes one tenant's instance of a
              product.
            properties:
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy controls what happens to the underlying databases
                  when this CR is deleted. Defaults to Retain — customer data is
                  never destroyed by an accidental kubectl delete.
                enum:
                - Retain
                - Delete
                type: string
              isolationOverride:
                description: |-
                  IsolationOverride forces a specific isolation mode for this
                  instance, regardless of the product's defaultIsolation. Use to
                  silo a high-compliance customer in an otherwise pool/bridge
                  product. Empty = use the product's default per-database setting.
                enum:
                - pool
                - bridge
                - silo
                type: string
              productRef:
                description: |-
                  ProductRef is the ProductDefinition.metadata.name. Cluster-scoped
                  reference (ProductDefinition is cluster-scoped).
                maxLength: 253
                type: string
              region:
                description: |-
                  Region pins the instance to a region (matches
                  ClusterRegistration.spec.region). Used by the RolloutController
                  (Phase 7) for region-scoped rollouts and by
                  data-residency policies.
                maxLength: 63
                type: string
              tenantID:
                description: |-
                  TenantID is the UUID identifying the tenant. Cross-referenced
                  against Falcon-ID's tenant directory; the controller does NOT
                  validate the UUID exists there (that's the orchestrator's
                  responsibility upstream).
                maxLength: 36
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                type: string
              tenantSlug:
                description: |-
                  TenantSlug is a human-readable tenant identifier surfaced in audit
                  logs and dashboards. Optional; many SaaS shops use the email
                  domain or organisation name.
                maxLength: 63
                type: string
            required:
            - productRef
            - tenantID
            type: object
          status:
            description: ProductInstanceStatus reports state machine progress + child
              resources.
            properties:
              appliedRoutes:
                description: |-
                  AppliedRoutes are the APISIX route IDs the controller created.
                  Empty in Phase 4 (HTTP integration is Phase 4.1).
                items:
                  type: string
                maxItems: 64
                type: array
              conditions:
                description: |-
                  Conditions reports per-step status:
                    Ready             — Phase=Active and every child resource is Ready
                    DatabasesReady    — every InstanceDatabase has Ready LogicalDatabase
                    SchemasReady      — every DatabaseSchema is Ready
                    MigrationsApplied — initial migrations from product schemas have
                                        all reached Succeeded
                    AuthConfigured    — SpiceDB tuples written (Phase 4.1)
                    RoutesRegistered  — APISIX routes upserted (Phase 4.1)
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              databases:
                description: |-
                  Databases lists child LogicalDatabase + DatabaseSchema refs.
                  Maintained on every reconcile; clearing it requires the deletion
                  flow to remove the children first.
                items:
                  description: |-
                    InstanceDatabase reports the concrete LogicalDatabase + DatabaseSchema
                    resources the controller created for this instance. One entry per
                    ProductDatabase declared in the ProductDefinition.
                  properties:
                    databaseSchemaRefs:
                      description: DatabaseSchemaRefs lists the DatabaseSchema CRs
                        for this database.
                      items:
                        type: string
                      type: array
                    key:
                      description: Key matches ProductDatabase.Key.
                      type: string
                    logicalDatabaseRef:
                      description: LogicalDatabaseRef is the namespaced name of the
                        LogicalDatabase CR.
                      type: string
                  required:
                  - key
                  - logicalDatabaseRef
                  type: object
                maxItems: 8
                type: array
              lastTransitionTime:
                description: LastTransitionTime is when Phase last changed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse state. ArgoCD health checks read
                  this field.
                enum:
                - Pending
                - Provisioning
                - Migrating
                - ConfiguringAuth
                - RegisteringRoutes
                - Active
                - Failed
                - Deactivating
                - Deactivated
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
