                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              pendingOperations:
                description: |-
                  PendingOperations counts the diff size from the last reconcile.
                  0 means the schema is at desired state. When SchemaSelector
                  fan-out is used this reflects the size of the emitted bundle's
                  op set (i.e. the most-behind schema's diff under MostBehindWins
                  policy, or the lockstep diff under Refuse with all schemas in
                  agreement).
                format: int32
                type: integer
            type: object
