---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: migrationplans.keystone.hexxlock.io
spec:
  group: keystone.hexxlock.io
  names:
    kind: MigrationPlan
    listKind: MigrationPlanList
    plural: migrationplans
    shortNames:
    - mp
    - plan
    singular: migrationplan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bundleRef
      name: Bundle
      type: string
    - jsonPath: .spec.bundleVersion
      name: Version
      type: string
    - jsonPath: .spec.schemaRef
      name: Schema
      type: string
    - jsonPath: .spec.statements[*]
      name: Statements
      type: integer
    - jsonPath: .spec.approved
      name: Approved
      type: boolean
    - jsonPath: .status.approvalMode
      name: Mode
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MigrationPlan is a controller-generated dry-run snapshot for one
          (MigrationBundle, DatabaseSchema) pair. Users do not create these
          directly; reviewers use them to inspect what is about to happen.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MigrationPlanSpec is generated by the MigrationController; users do
              NOT author plans directly. Spec is intentionally narrow because a plan
              is a snapshot of a (bundle, schema) pair at a point in time.
            properties:
              approved:
                default: false
                description: |-
                  Approved is the explicit Plan-Gate-Apply gate. The
                  MigrationPlanReconciler sets this to true automatically when the
                  matched SchemaPolicies resolve to approvalMode=Auto (the default
                  for backward compatibility); in Manual mode, a human or CI
                  principal flips it after reviewing spec.statements. The
                  MigrationExecution controller refuses to apply SQL until this
                  field is true.

                  Default false so new plans stop at the gate unless a policy
                  explicitly opts into auto-approval. Existing deployments
                  without a SchemaPolicy declaring planApproval fall back to
                  Auto — matches pre-A4 behavior.
                type: boolean
              bundleRef:
                description: BundleRef is the MigrationBundle this plan was generated
                  from.
                maxLength: 253
                type: string
              bundleVersion:
                description: |-
                  BundleVersion freezes the bundle version at the moment the plan
                  was generated. If the bundle changes after the plan is created,
                  the plan stays accurate to its snapshot — a new plan is generated
                  for the new version.

                  MaxLength 253 mirrors MigrationBundle.spec.version (bumped in
                  keystone!109) — bundleVersion must accommodate the content-
                  addressed naming `<sd.Name>-declarative-<contentHash>` introduced
                  in 372de32. Asymmetric limits between Bundle.spec.version and
                  Plan.spec.bundleVersion would silently reject Plans for SDs
                  whose names + hash combo exceed 64 chars even though the upstream
                  Bundle was accepted.
                maxLength: 253
                type: string
              findings:
                description: |-
                  Findings holds lint output. The MigrationController refuses to
                  graduate the plan into a MigrationExecution if any finding has
                  severity >= the matched SchemaPolicy's MinLintLevel.
                items:
                  description: |-
                    LintFinding is a single squawk/conftest finding produced during the
                    plan phase.
                  properties:
                    file:
                      description: File is the SQL filename within the source where
                        the finding fired.
                      maxLength: 253
                      type: string
                    line:
                      description: Line is the 1-indexed line in the source file.
                        0 if not applicable.
                      format: int32
                      minimum: 0
                      type: integer
                    message:
                      description: Message is a human-readable description.
                      maxLength: 4096
                      type: string
                    rule:
                      description: |-
                        Rule is the linter's rule identifier (e.g. squawk's
                        "adding-required-field" or conftest's "deny-truncate").
                      maxLength: 128
                      type: string
                    severity:
                      description: 'Severity matches LintLevel: error | warning |
                        notice.'
                      enum:
                      - error
                      - warning
                      - notice
                      type: string
                  required:
                  - message
                  - rule
                  - severity
                  type: object
                maxItems: 512
                type: array
              schemaRef:
                description: SchemaRef is the DatabaseSchema this plan targets.
                maxLength: 253
                type: string
              statements:
                description: |-
                  Statements is the ordered list of DDL the controller intends to
                  run. Truncated per-statement to 4 KiB; for review of full SQL,
                  inspect the source ConfigMap referenced by the bundle.
                items:
                  description: |-
                    PlannedStatement is one DDL statement the controller intends to execute,
                    surfaced for review before MigrationExecutions are created.
                  properties:
                    file:
                      description: File is the source filename the statement came
                        from.
                      type: string
                    index:
                      description: Index is the 1-indexed statement number within
                        File.
                      format: int32
                      minimum: 1
                      type: integer
                    sql:
                      description: |-
                        SQL is the rendered statement text (truncated to 4 KiB to keep
                        the CR size manageable; full SQL is in the source ConfigMap).
                      maxLength: 4096
                      type: string
                  required:
                  - file
                  - index
                  - sql
                  type: object
                maxItems: 2048
                type: array
            required:
            - bundleRef
            - bundleVersion
            - schemaRef
            type: object
          status:
            description: |-
              MigrationPlanStatus reports whether the plan was approved and what
              happened next.
            properties:
              approvalMode:
                description: |-
                  ApprovalMode is the effective mode the MigrationPlanReconciler
                  resolved from matched SchemaPolicies. Populated on every
                  reconcile. Observability-only — the authoritative gate is
                  spec.approved.
                enum:
                - Auto
                - Manual
                type: string
              approvalPolicyName:
                description: |-
                  ApprovalPolicyName names the SchemaPolicy that selected the
                  current approvalMode. Empty when no matched policy declared
                  planApproval (i.e. the default Auto was taken). Useful for
                  answering "why is this plan waiting?" from kubectl describe.
                maxLength: 253
                type: string
              conditions:
                description: |-
                  Conditions:
                    Linted     — lint phase complete; findings populated.
                    Approved   — plan passed all matched SchemaPolicies + admission gate.
                    Executing  — at least one MigrationExecution has been created.
                    Succeeded  — every spawned MigrationExecution is Succeeded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              executionRef:
                description: |-
                  ExecutionRef is the MigrationExecution that this plan spawned.
                  Empty until the plan is approved and an execution is created.
                maxLength: 253
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
